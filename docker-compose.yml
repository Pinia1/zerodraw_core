services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_IMAGE_THUMBNAIL: ${VITE_IMAGE_THUMBNAIL:-/api/file/thumbnail}
        VITE_IMAGE_FILE: ${VITE_IMAGE_FILE:-/api/file/s3}
        VITE_R2_URL: ${VITE_R2_URL:-https://cdn.zerodraw.cn}
        VITE_R2_THUMBNAIL_URL: ${VITE_R2_THUMBNAIL_URL:-https://cdn.zerodraw.cn/cdn-cgi/image}
    ports:
      - "80:3000"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - "3070"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:./data/app.db
      UPLOAD_PROVIDER: ${UPLOAD_PROVIDER:-local}
      LOCAL_UPLOAD_DIR: ./data/uploads
      PORT: "3070"
      HOST: "0.0.0.0"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
